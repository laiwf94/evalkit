[project]
name = "evalkit"
version = "0.1.0"
description = "Evaluation and regression testing for LLM applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Woon Fei Lai" }]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.13.0",
    "fastapi==0.143.0",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "referencing==0.37.0",
    "regex==2026.9.29",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.5",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "types-regex==2026.9.29.20261005",
    "types-jsonschema==4.26.0.20261006",
    "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.uv]
# Only resolve releases that have been public for at least two weeks, except
# where a newer release fixes a published vulnerability (pip-audit in CI).
exclude-newer = "2026-10-11T00:00:00Z"
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", filelock = "2026-10-18T00:00:00Z", opentelemetry-api = "2026-10-30T00:00:00Z" }
constraint-dependencies = ["certifi>=2026.10.19", "filelock>=4.2.1", "opentelemetry-api>=1.45.2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "C4", "RET", "TRY", "N", "ASYNC"]
ignore = ["PLR0913", "PLR2004", "TRY003", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "TRY301", "ASYNC110", "PLW1510", "S105", "S106", "S311", "PLR2004", "S603", "S607", "PLC0415", "TRY002"]
"benchmarks/**" = ["S311", "T201"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "benchmarks"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=evalkit --cov-report=term-missing:skip-covered --cov-fail-under=90"
markers = [
    "live: calls the real Claude API; skipped without ANTHROPIC_API_KEY",
    "e2e: needs Docker for Testcontainers",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["evalkit"]
omit = ["*/evalkit/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
