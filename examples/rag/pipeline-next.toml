# The pipeline of pipeline.toml on the retriever change under review ("kb-search-next"):
# everything else is the same, so the gate measures the retriever alone.
#
#   python examples/rag/server.py &
#   export EVALKIT_HTTP_TARGETS_FILE=examples/rag/endpoints.toml
#   export EVALKIT_PROVIDERS_FILE=examples/rag/providers.toml
#   export EVALKIT_PRICES_FILE=examples/rag/prices.toml
#   evalkit run examples/rag/pipeline-next.toml
label = "rag-next"

[dataset]
name = "kb-questions"
path = "retrieval.jsonl"

[target]
type = "pipeline"
contexts = 3

[target.retrieval]
endpoint = "kb-search-next"
k = 5

[target.generation]
provider = "rag-fake"
model = "reader-1"
system = "Answer the question from the documents only."
template = """<question>
{{ query }}
</question>

<documents>
{{ contexts }}
</documents>"""
max_tokens = 512

# Retrieval, against the graded labels: these gate.
[[scorers]]
type = "ranking"
metric = "recall"
k = 3

[[scorers]]
type = "ranking"
metric = "ndcg"
k = 5

[[scorers]]
type = "ranking"
metric = "mrr"
gate = false

# The reference answer's claims in the 3 documents the reader was given.
[[scorers]]
type = "context_recall"
provider = "rag-fake"
model = "grader-1"
gate = false

# The answer's claims against those documents: evidence for the report.
[[scorers]]
type = "faithfulness"
provider = "rag-fake"
model = "grader-1"
gate = false

# The reference answer's claims in the answer: this gates.
[[scorers]]
type = "answer_completeness"
provider = "rag-fake"
model = "grader-1"

[options]
concurrency = 4
